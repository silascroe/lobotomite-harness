name: Deploy Agent Lab showcase

# The public site is the real console (agent-lab/ui) in read-only showcase
# mode, replaying recorded runs exported by scripts/export_showcase.py.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "agent-lab/ui/**"
      - "site/showcase/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Test and assemble the showcase
        shell: bash
        run: |
          for f in app.js narration.js source.js specimen.js; do node --check "agent-lab/ui/$f"; done
          node --test agent-lab/ui/test_ui_contract.mjs agent-lab/ui/test_narration.mjs
          test -f site/showcase/manifest.json
          mkdir -p _site
          cp agent-lab/ui/index.html agent-lab/ui/app.js agent-lab/ui/narration.js agent-lab/ui/source.js \
             agent-lab/ui/specimen.js agent-lab/ui/styles.css agent-lab/ui/favicon.svg _site/
          cp -r site/showcase _site/showcase
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
